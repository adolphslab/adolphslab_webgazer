[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adolphslab-webgazer"
version = "0.2.0"
description = "Reproducible pipelines for quadrant-based webcam eye-tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Adolphs Lab" }
]
keywords = ["eye-tracking", "webgazer", "reproducibility", "statistics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "patsy>=0.5,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
stats = [
  "pingouin>=0.5,<0.6"
]
ml = [
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2"
]
plots = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1"
]
bayes = [
  "bambi>=0.13,<1",
  "pymc>=5.15,<6",
  "arviz>=0.18,<1"
]
dev = [
  "build>=1.2.2",
  "mypy>=1.15",
  "pandas-stubs>=2.2.3.250308",
  "pytest>=8.3",
  "pytest-cov>=5,<6",
  "ruff>=0.9",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=3.7,<4"
]

[project.scripts]
alabwebgazer = "alabwebgazer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alabwebgazer"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
  "runs",
  "outputs"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N806"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
